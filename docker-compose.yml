services:
  etf-scout-mcp:
    image: ghcr.io/pierdom/etf-scout-mcp:edge
    build: .
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - ~/Docker/etf-scout-mcp/data:/data
    environment:
      ETF_SCOUT_MCP_TRANSPORT: http
      ETF_SCOUT_MCP_HTTP_HOST: 0.0.0.0
      ETF_SCOUT_MCP_HTTP_PORT: 8765
      ETF_SCOUT_MCP_HTTP_BEARER_TOKEN: ${ETF_SCOUT_MCP_HTTP_BEARER_TOKEN}
      ETF_SCOUT_MCP_CACHE: /data/cache.db
      ETF_SCOUT_MCP_LOG_LEVEL: ${ETF_SCOUT_MCP_LOG_LEVEL:-INFO}
      ETF_SCOUT_MCP_CACHE_TTL_QUOTE: ${ETF_SCOUT_MCP_CACHE_TTL_QUOTE:-300}
      ETF_SCOUT_MCP_CACHE_TTL_PROFILE: ${ETF_SCOUT_MCP_CACHE_TTL_PROFILE:-86400}
      ETF_SCOUT_MCP_CACHE_TTL_HISTORY: ${ETF_SCOUT_MCP_CACHE_TTL_HISTORY:-3600}
      OPENFIGI_API_KEY: ${OPENFIGI_API_KEY:-}
